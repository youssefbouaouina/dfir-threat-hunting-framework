title: Persistence via Registry Run key pointing to a Temp folder
id: rule-003
artifact_type: persistence
technique_id: T1547.001
severity: high
description: >
  Registry Run/RunOnce entries pointing at Temp or AppData\Local\Temp
  are a classic sign of malware establishing boot persistence from a
  dropped, non-installed binary.
condition:
  value_data_contains: ["\\Temp\\", "/tmp/", "AppData\\Local\\Temp"]
