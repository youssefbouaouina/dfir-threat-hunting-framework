title: Scheduled task invoking a script interpreter directly
id: rule-005
artifact_type: scheduled_task
technique_id: T1053.005
severity: medium
description: >
  Scheduled tasks that directly invoke powershell.exe, cmd.exe, or
  wscript.exe (rather than a signed, installed application) are a
  common persistence and execution technique.

  NB: matched with the `_has_word` operator (whole-token match, not
  substring) — the substring "cmd.exe" also occurs inside the legitimate
  binary name "dsregcmd.exe" (TUNING-1), which produced false positives
  on the built-in task \Microsoft\Windows\Workplace Join\Recovery-Check.
condition:
  task_to_run_has_word: ["powershell", "cmd.exe", "wscript", "mshta"]
