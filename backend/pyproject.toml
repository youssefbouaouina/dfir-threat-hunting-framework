[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["venv", ".venv", "db", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP006", "UP035", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"**/__main__.py" = ["S101"]
# Alembic-generated migration DDL has unavoidably long lines.
"migrations/versions/*.py" = ["E501", "I001", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# Gradual typing (D1): new code is checked strictly, existing unannotated
# modules are tolerated. No unreachable/import errors, no unused ignores.
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = true
