[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["venv", ".venv", "db", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP006", "UP035", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"**/__main__.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
