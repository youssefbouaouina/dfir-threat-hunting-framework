# DFIR Threat Hunting Framework — CI/CD pipeline (Phase 2).
#
# Two paths:
#   * On every push/PR to main: lint + test (fast feedback gate).
#   * On a version tag (v*): build + publish the backend image to GHCR
#     (tagged semver + short sha) and run a smoke test against the built image.
#
# Secrets are injected from the repository's Actions secrets — never
# committed to the repo (see backend/.env.example for the variable list).

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a git range (base^..head); a shallow depth-1 clone
          # cannot resolve the range base and the secret-scan step fails.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, gradual)
        run: mypy --config-file pyproject.toml .

      - name: Test (pytest)
        run: pytest -v

      - name: Dependency audit (pip-audit)
        # PYSEC-2026-2447 (CVE-2025-69872): diskcache 5.6.3 uses pickle for
        # cache serialization; RCE requires write access to the cache dir.
        # No fixed release exists - python-diskcache is unmaintained (5.6.3 is
        # the latest on PyPI); the fix only ships in a temporary
        # `mapped-diskcache` fork (different package name, not a drop-in for
        # pySigma's `diskcache` dependency). diskcache is a transitive dep of
        # pySigma; our usage is a per-process local rule cache in an
        # app-owned directory, not attacker-writable.
        run: pip-audit --progress-spinner=off --ignore-vuln PYSEC-2026-2447

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  agent-e2e:
    name: Agent → backend e2e (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t dfir-backend:e2e .

      - name: Build agent image
        run: docker build -f Dockerfile.agent -t dfir-agent:e2e .

      - name: Start Redis
        run: docker run -d --name dfir-redis -p 6379:6379 redis:7-alpine

      - name: Start backend (async ingest via Redis, shared DB volume)
        run: |
          docker run -d --name dfir-backend -p 8000:8000 \
            -v dfir-e2e-db:/data \
            -e DATABASE_URL=sqlite:////data/dfir.db \
            -e INGEST_QUEUE_URL=redis://127.0.0.1:6379/0 \
            dfir-backend:e2e
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "backend healthy"; break
            fi
            sleep 1
          done

      - name: Start ingest worker (drains the queue, same DB volume)
        run: |
          docker run -d --name dfir-worker --network host \
            -v dfir-e2e-db:/data \
            -e DATABASE_URL=sqlite:////data/dfir.db \
            -e INGEST_QUEUE_URL=redis://127.0.0.1:6379/0 \
            dfir-backend:e2e python -m workers.ingest_worker

      - name: Enroll agent + run one-shot collection
        run: |
          docker run --rm --network host --name dfir-agent dfir-agent:e2e \
            --api-url http://127.0.0.1:8000 --enroll \
            --only processes,network

      - name: Wait for worker to drain the queue
        run: sleep 5

      - name: Verify artifacts reached the backend (async path)
        run: |
          curl -fsS "http://127.0.0.1:8000/artifacts?limit=50" > artifacts.json
          python -c "
          import json, sys
          rows = json.load(open('artifacts.json'))
          types = {a['artifact_type'] for a in rows}
          assert rows, 'no artifacts ingested from agent (async worker failed)'
          print('e2e OK — ingested artifacts:', sorted(types))
          "
          docker stop dfir-backend dfir-worker dfir-redis

  build-and-push:
    name: Build & push backend image (GHCR)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image }}:latest
            ghcr.io/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health check on published image)
        run: |
          docker run --rm -d --name dfir-smoke -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./dfir.db \
            ghcr.io/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "health OK"
              docker stop dfir-smoke
              exit 0
            fi
            sleep 2
          done
          echo "health check failed" >&2
          docker logs dfir-smoke || true
          docker stop dfir-smoke || true
          exit 1
