name: DFIR Backend CI/CD

# Runs on every push/PR touching backend code, plus manually via the
# Actions tab (useful to trigger a rebuild without a code change, e.g.
# after updating a Docker Hub secret).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Import sanity check
        # Cheap but real: if any module has a syntax/import error, this
        # catches it before it ever reaches a Docker build.
        run: |
          python -c "import main"

      - name: Run unit tests (pytest)
        run: |
          python -m pytest tests -q

      - name: Validate detection rules load without error
        run: |
          python -c "from sigma_matcher import load_rules; rules = load_rules('sigma_rules'); assert len(rules) > 0, 'no rules loaded'; print(f'{len(rules)} sigma rules OK')"
          python -c "import yara; yara.compile(filepath='yara_rules/curated_ruleset.yar'); print('yara rules compile OK')"

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Only push an image on an actual merge to main — PRs get linted
    # and tested, not published, avoiding half-finished images on Docker Hub.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dfir-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dfir-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
