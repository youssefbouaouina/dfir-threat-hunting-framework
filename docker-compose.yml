# DFIR Threat Hunting Framework — development / demo stack.
#
#   docker compose up --build
#
# Backend + Postgres. The backend runs migrations at startup and exposes the
# API on http://127.0.0.1:8000 (docs at /docs). Auth is OFF by default
# (open-lab demo); set AUTH_ENABLED=true + ADMIN_API_KEY/AGENT_API_KEYS in
# the environment or a .env file to enable it.
#
# Async ingest (Phase 4/F1): set INGEST_QUEUE_URL=redis://redis:6379/0 in the
# backend environment to route /ingest through Redis (returns 202); the
# `worker` service drains the queue. Leave it unset for synchronous ingest.
#
# The collector agent is intentionally NOT containerized here: in production
# it is a lightweight native agent on each endpoint. See the CI workflow for
# how the backend image is built and pushed.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dfir
      POSTGRES_PASSWORD: dfir
      POSTGRES_DB: dfir
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfir -d dfir"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://dfir:dfir@db:5432/dfir
      AUTH_ENABLED: "false"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin-key}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string}
      AGENT_API_KEYS: ${AGENT_API_KEYS:-}
      DETECTION_INTERVAL_SECONDS: "30"
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-high}
      NOTIFY_SMTP_HOST: ${NOTIFY_SMTP_HOST:-}
      NOTIFY_SMTP_PORT: ${NOTIFY_SMTP_PORT:-587}
      NOTIFY_SMTP_USER: ${NOTIFY_SMTP_USER:-}
      NOTIFY_SMTP_PASSWORD: ${NOTIFY_SMTP_PASSWORD:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      # Uncomment to enable async ingest (the worker below must also run):
      # INGEST_QUEUE_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "workers.ingest_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://dfir:dfir@db:5432/dfir
      AUTH_ENABLED: "false"
      # Uncomment to enable async ingest (the backend must set the same URL):
      # INGEST_QUEUE_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Optional queue-driven detection worker (Phase 4/F5). By default the
  # backend's own scheduler already runs detection on DETECTION_INTERVAL_SECONDS,
  # so this service is OFF unless explicitly enabled. Uncomment the block to run
  # detection in a separate process (useful for heavier fleets); when enabled,
  # consider setting DETECTION_INTERVAL_SECONDS=0 in the backend to avoid two
  # pipelines racing.
  # detection-worker:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   command: ["python", "-m", "workers.detection_worker"]
  #   environment:
  #     DATABASE_URL: postgresql+psycopg2://dfir:dfir@db:5432/dfir
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  pgdata:
