version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: dfir-backend
    ports:
      - "8000:8000"
    volumes:
      # Named volumes so the SQLite DB and generated PDF reports survive
      # `docker compose down` / container restarts — without this,
      # every restart would wipe your detection history.
      - dfir-data:/app/data
      - dfir-reports:/app/reports
    env_file:
      - ./backend/.env   # ABUSEIPDB_API_KEY, DETECTION_INTERVAL_SECONDS, etc. — not committed to git
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dfir-data:
  dfir-reports:
