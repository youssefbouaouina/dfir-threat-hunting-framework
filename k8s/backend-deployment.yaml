# DFIR Threat Hunting Framework — backend deployment (k8s, HA).
#
# Three replicas behind a Service; readiness/liveness both hit /health (no
# auth dependency). Rolling updates are maxSurge=1/maxUnavailable=0 so one pod
# is always serving during deploys. The HPA (backend-hpa.yaml) scales on CPU
# and memory; the PodDisruptionBudget (backend-pdb.yaml) keeps >=2 ready.
#
# The container runs the entrypoint that applies Alembic migrations at boot;
# for a true blue/green migration story run `alembic upgrade head` as a
# pre-deploy Job instead of racing three replicas. Postgres/Redis are provided
# by postgres.yaml (or point DATABASE_URL/INGEST_QUEUE_URL at managed services).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfir-backend
  namespace: dfir
  labels:
    app.kubernetes.io/name: dfir-threat-hunting-framework
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: dfir
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: dfir
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/youssefbouaouina/dfir-threat-hunting-framework:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dfir-config
            - secretRef:
                name: dfir-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
