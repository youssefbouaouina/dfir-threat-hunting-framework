# DFIR Threat Hunting Framework — backend Service (k8s).
apiVersion: v1
kind: Service
metadata:
  name: dfir-backend
  namespace: dfir
  labels:
    app.kubernetes.io/name: dfir-threat-hunting-framework
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: dfir
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
