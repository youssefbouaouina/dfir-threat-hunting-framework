# DFIR Threat Hunting Framework — Secret template (k8s).
#
# Copy to secret.yaml, fill in real values, and apply it. NEVER commit the
# real secret.yaml. StringData base64-encodes on apply; everything here is a
# placeholder. Change ADMIN_API_KEY/AUTH_SECRET before going live.
apiVersion: v1
kind: Secret
metadata:
  name: dfir-secrets
  namespace: dfir
  labels:
    app.kubernetes.io/name: dfir-threat-hunting-framework
    app.kubernetes.io/part-of: dfir
type: Opaque
stringData:
  ADMIN_API_KEY: "change-me-admin-key"
  AUTH_SECRET: "change-me-to-a-long-random-string"
  AGENT_API_KEYS: "change-me-agent-key"
  ABUSEIPDB_API_KEY: ""
  OTX_API_KEY: ""
  NOTIFY_WEBHOOK_URL: ""
  NOTIFY_WEBHOOK_SECRET: ""
  NOTIFY_SMTP_PASSWORD: ""
