title: Established connection to a common malware/C2 port
id: rule-010
artifact_type: network
technique_id: T1571
severity: high
description: >
  Ports 4444, 1337, 6666, and 31337 are long-standing defaults for
  reverse shells and legacy C2 frameworks (e.g. Metasploit's default
  4444). A live established connection to one of these is a strong
  signal, though port numbers alone are not conclusive.
condition:
  status: ESTABLISHED
  remote_address_contains: [":4444", ":1337", ":6666", ":31337"]
