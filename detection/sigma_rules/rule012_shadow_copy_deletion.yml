title: Shadow copy / backup catalog deletion (ransomware precursor)
id: rule-012
artifact_type: process
technique_id: T1490
severity: critical
description: >
  vssadmin delete shadows and wbadmin delete catalog are almost never
  run by legitimate day-to-day activity and are a strong, high-
  confidence ransomware precursor signal.
condition:
  cmdline_contains: ["vssadmin delete shadows", "wbadmin delete catalog", "bcdedit /set"]
